services:
  - type: web
    name: proanalyst-labs-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_USER
        value: admin
      - key: STAFF_PASS
        generateValue: true
      - key: ENABLE_DEBUG_ENDPOINTS
        value: "false"
